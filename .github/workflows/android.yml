name: Android debug APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "::error::Android SDK manager was not found under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Validate APK metadata and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK" || { echo "::error::APK is missing or empty"; exit 1; }
          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='org.aisociety.one'" apk-badging.txt
          grep -q "sdkVersion:'26'" apk-badging.txt
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          sha256sum "$APK" | tee apk-sha256.txt
          ls -lh "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: ai-society-one-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            apk-badging.txt
            apk-sha256.txt
          if-no-files-found: error

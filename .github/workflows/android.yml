name: Android debug APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # Avoid android-actions/setup-android@v3: it invokes sdkmanager "tools",
      # a removed legacy package on the GitHub-hosted runner.
      # ubuntu-24.04 already provides Android SDK command-line tools.
      - name: Locate Android SDK
        run: |
          test -d "$ANDROID_HOME"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" || command -v sdkmanager
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Measure APK
        run: |
          ls -lh app/build/outputs/apk/debug/*.apk
          wc -c app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ai-society-one-debug-apk
          path: app/build/outputs/apk/debug/*.apk
